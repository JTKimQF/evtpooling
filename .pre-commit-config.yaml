repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests)/  # Only run Ruff on src/ and tests/
      - id: ruff-format
        files: ^(src|tests)/

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        files: ^(src|tests)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(src|tests)/
      - id: end-of-file-fixer
        files: ^(src|tests)/

  # Automatically updates rev: fields --> pre-commit autoupdate
  # MANUALLY RUN ALL CONFIGURED HOOKS --> pre-commit run --all-files