line-length = 100

exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    ".tox",
    "docs",
]

[format]
docstring-code-format = true  # Format code blocks in docstrings
quote-style = "double"        # Enforce single/double quotes
indent-style = "space"        # or "tab"
line-ending = "lf"            # or "crlf" for Windows

[lint]
select = ["B", "C", "E", "F", "W", "B9"]
ignore = ["E203"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"etl.py" = ["F401", "F403", "F405"]
"etl_defaults.py" = ["F403", "F405"]
"extract.py" = ["F403", "F405"]
"transform.py" = ["F403", "F405", "C901"]
"test_etl.py" = ["F403", "F405"]
"test_extract.py" = ["F403", "F405"]
"test_transform.py" = ["F403", "F405"]

[lint.mccabe]
max-complexity = 10

# CODE REVIEW COMMANDS
# ruff check src/ tests/ --> to check the src and tests directories
# ruff check src/ tests/ --fix --> checks directories and fixes
# ruff check src/ tests/ --fix --diff --> shows fixes before fixing it

# FORMAT REVIEW COMMANDS
# ruff format src/ tests/ --> Enables Ruff's formatter
# ruff format . --check --diff --> shows format fixes before fixing it
